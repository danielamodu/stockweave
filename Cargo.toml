# Workspace root for the StockWeave Anchor project.
# Members resolve to programs/*/Cargo.toml (currently programs/stockweave).
# This file must exist at the project root in Solana Playground alongside Anchor.toml.
[workspace]
members = ["programs/*"]
resolver = "2"

# Overflow checks in release builds — required by Anchor and appropriate for a
# program handling weights/notional math (wrapping arithmetic would be a bug,
# not a silent truncation). Enabled for the local WSL toolchain build.
[profile.release]
overflow-checks = true
