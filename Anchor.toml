# StockWeave Anchor workspace (source of truth for browser Playground runs).
# Program ID verified on Devnet 2026-09-19 (executable, BPF upgradeable loader).
# No Solana toolchain is required on the local PC.

[features]
seeds = false
skip-lint = false

[programs.devnet]
stockweave = "2z9QVsHonA4QcZkwLAcb1P5BGyrTL9UYUrE45TrmqC2a"

[registry]
url = "https://api.apr-1.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
