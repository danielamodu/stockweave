[package]
name = "stockweave"
version = "0.1.0"
description = "StockWeave strategy accounts and lifecycle (Phase 4)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stockweave"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required by anchor 0.30.1 to generate the IDL during `anchor build`.
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# init-if-needed is required: set_assets/set_rules/set_agent_permission use
# `init_if_needed` so protected instructions reach their in-body guards (e.g.
# the pause check) instead of failing on account re-init. Without this feature
# the program does not compile. Mirror this line into the Playground Cargo.toml.
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# Stage 5b — trustless Pyth read. Fallback ladder if the Solana toolchain
# version conflicts: 0.6.1 → 0.4.0 → 2.0.0 (see docs/phase05b-pending.md).
pyth-solana-receiver-sdk = "0.6.1"
